[package]
name = "matrixos"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & User"]
description = "A bare-metal experimental OS with integrated LLM"

[dependencies]
limine = "0.6.3"
linked_list_allocator = "0.10"
spin = "0.9"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.14"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
